name: Publish

on:
  push:
    tags: v[0-9]+.[0-9]+.[0-9]+

permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: 24

        registry-url: 'https://registry.npmjs.org'

    - run: npm publish
